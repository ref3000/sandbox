<!DOCTYPE html>
<html lang="ja">
<head>
<title>kbnr2設定判別</title>
<meta name="viewport" content="width=320,user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; background: #fdfdfd; }
  header { background: #d0eaff; position: fixed; width: 320px; height: 35px; display: flex; align-items: center; z-index: 100; border-bottom: 1px solid #ccc; }
  .rt { font-size: 10px; margin-left: 4px; color: #666; }
  .result { width: 34px; font-size: 10px; font-weight: bold; text-align: right; margin-right: 4px; }
  .padding-top { height: 40px; }
  .b-container { display: flex; justify-content: space-around; margin-top: 8px; padding: 0 4px; }
  button { width: 50px; height: 50px; font-size: 9px; text-align: center; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; }
  .b-blue { background-color: #a0d8ef; }
  .b-green { background-color: #83b85d; }
  .b-red { background-color: #f69ea1; }
  .b-yellow { background-color: #dcd15f; }
  .b-gray { background-color: #eeeeee; }
  .b-dark { background-color: #cccccc; }
  .b-purple { background-color: #cda8d8; }
  #history { margin-top: 10px; padding: 4px; font-size: 12px; }
  .history-item { border-bottom: 1px solid #eee; padding: 4px; display: flex; justify-content: space-between; align-items: center; }
  .history-bt { width: 24px; height: 24px; font-size: 10px; margin-left: 2px; border: 1px solid #999; border-radius: 2px; background: #fff; cursor: pointer; }
  .history-label { flex-grow: 1; margin-left: 4px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bignumber.js/8.1.1/bignumber.min.js"></script>
</head>
<body>
<header>
  <span class="rt">1:</span><span id="r0" class="result"></span>
  <span class="rt">2:</span><span id="r1" class="result"></span>
  <span class="rt">3:</span><span id="r2" class="result"></span>
  <span class="rt">4:</span><span id="r3" class="result"></span>
  <span class="rt">5:</span><span id="r4" class="result"></span>
  <span class="rt">6:</span><span id="r5" class="result"></span>
</header>
<div class="padding-top"></div>

<div class="b-container">
  <button onclick="onClearHistory()" class="b-dark" style="width: 50px;">履歴<br>全消去</button>
  <div style="width: 250px; text-align: center; font-size: 14px; font-weight: bold; line-height: 50px; background: #fff; border: 1px solid #999; border-radius: 4px;">
    無名: <span id="mumei-pt" style="color: #e74c3c;">0</span>pt &nbsp;|&nbsp; 
    生駒: <span id="ikoma-pt" style="color: #2ecc71;">0</span>pt
  </div>
</div>

<div class="b-container">
  <button onclick="apply('mumei_off')" class="b-red">無名<br>発光なし</button>
  <button onclick="apply('mumei_on')" class="b-red">無名<br>発光中</button>
  <button onclick="apply('mumei_lit')" class="b-red">無名<br>発光</button>
  <button onclick="apply('mumei_high')" class="b-red">無名<br>高確帯</button>
  <button onclick="apply('combo_mumei')" class="b-red">複合無名</button>
  <button onclick="apply('combo_mumei_high')" class="b-red">複合無名<br>高確帯</button>
</div>

<div class="b-container">
  <button onclick="apply('ikoma_off')" class="b-green">生駒<br>発光なし</button>
  <button onclick="apply('ikoma_on')" class="b-green">生駒<br>発光中</button>
  <button onclick="apply('ikoma_lit')" class="b-green">生駒<br>発光</button>
  <button onclick="apply('ikoma_high')" class="b-green">生駒<br>高確帯</button>
  <button onclick="apply('combo_ikoma')" class="b-green">複合生駒</button>
  <button onclick="apply('combo_ikoma_high')" class="b-green">複合生駒<br>高確帯</button>
</div>

<div class="b-container">
  <button onclick="apply('cz_mumei')" class="b-blue">無名CZ<br>当選</button>
  <button onclick="apply('cz_mumei_douai')" class="b-blue">無名CZ<br>銅藍当選</button>
  <button onclick="apply('cz_ikoma')" class="b-blue">生駒CZ<br>当選</button>
  <button onclick="apply('cz_ikoma_douai')" class="b-blue">生駒CZ<br>銅藍当選</button>
  <button onclick="apply('cz_allstar_douai')" class="b-blue">ｵｰﾙｽﾀｰ<br>銅藍当選</button>
  <button onclick="apply('yuri_cut')" class="b-gray">有利切れ</button>
</div>

<div style="font-size:11px; margin:8px 0 2px 4px; font-weight:bold; color:#555;">【AT中ボイス】</div>
<div class="b-container">
  <button onclick="apply('voice_f')" class="b-red">女性</button>
  <button onclick="apply('voice_m')" class="b-blue">男性</button>
  <button onclick="apply('voice_none')" class="b-gray">ボイス<br>なし</button>
  <button onclick="apply('voice_mumei_shukon')" class="b-red">無名<br>ｼｭｺﾝ</button>
  <button onclick="apply('voice_ayame')" class="b-yellow">菖蒲<br>饅頭</button>
  <button onclick="apply('voice_ikoma')" class="b-green">生駒<br>誇り</button>
</div>
<div class="b-container">
  <button onclick="apply('voice_kurusu')" class="b-purple">来栖<br>あの世</button>
  <button onclick="apply('voice_kage_naze')" class="b-dark">景行<br>何故</button>
  <button onclick="apply('voice_kage_hito')" class="b-dark">景行<br>人か</button>
  <button onclick="apply('voice_kage_kotoshi')" class="b-dark">景行<br>最後</button>
  <button onclick="apply('voice_mumei_futsu')" class="b-red">無名<br>普通</button>
  <div style="width: 50px;"></div>
</div>

<div style="font-size:11px; margin:8px 0 2px 4px; font-weight:bold; color:#555;">【キャラ紹介・ST終了画面等】</div>
<div class="b-container">
  <button onclick="apply('char_f')" class="b-red">キャラ<br>女性</button>
  <button onclick="apply('char_m')" class="b-blue">キャラ<br>男性</button>
  <button onclick="apply('char_biba')" class="b-purple">キャラ<br>美馬</button>
  <button onclick="apply('st_default')" class="b-gray">ST画面<br>デフォ</button>
  <button onclick="apply('st_shugo')" class="b-yellow">ST画面<br>集合</button>
  <button onclick="apply('st_mizugi')" class="b-blue">ST画面<br>水着</button>
</div>
<div style="font-size:11px; margin:8px 0 2px 4px; font-weight:bold; color:#555;">【下段ベル】</div>
<div class="b-container" style="justify-content: flex-start; gap: 8px; margin-bottom: 10px;">
  <input type="number" id="bell_g" placeholder="G数" style="width: 100px; padding: 6px; border: 1px solid #ccc; border-radius: 4px;" onchange="calcHistory()">
  <button onclick="apply('low_bell')" class="b-yellow" style="width: 100px; font-size: 12px;">下段ベル<br>(履歴追加)</button>
</div>

<div id="history"></div>

<script>
  const S = 6;
  let sr = Array.from({ length: S }, () => BigNumber(1));
  let history = []; 

  function applyIndependentRates(rates, count) {
    for (let s = 0; s < S; s++) {
      sr[s] = sr[s].times(BigNumber(rates[s]).pow(count));
    }
  }

  const displayMap = {
    "mumei_off": "無名 発光なし", "mumei_on": "無名 発光中", "mumei_lit": "無名 発光",
    "mumei_high": "無名 高確帯", "combo_mumei": "複合無名", "combo_mumei_high": "複合無名 高確帯",
    "ikoma_off": "生駒 発光なし", "ikoma_on": "生駒 発光中", "ikoma_lit": "生駒 発光",
    "ikoma_high": "生駒 高確帯", "combo_ikoma": "複合生駒", "combo_ikoma_high": "複合生駒 高確帯",
    "cz_mumei": "無名CZ 当選", "cz_mumei_douai": "無名CZ 銅藍当選",
    "cz_ikoma": "生駒CZ 当選", "cz_ikoma_douai": "生駒CZ 銅藍当選",
    "cz_allstar_douai": "オールスター 銅藍当選", "yuri_cut": "有利切れ",
    "voice_f": "ボイス 女性", "voice_m": "ボイス 男性", "voice_none": "ボイス なし",
    "voice_mumei_shukon": "ボイス 無名ｼｭｺﾝ", "voice_ayame": "ボイス 菖蒲おまんじゅう", "voice_ikoma": "ボイス 生駒俺の誇れる",
    "voice_kurusu": "ボイス 来栖あの世で", "voice_kage_naze": "ボイス 景行何故", "voice_kage_hito": "ボイス 景行人か",
    "voice_kage_kotoshi": "ボイス 景行最後", "voice_mumei_futsu": "ボイス 無名普通じゃない",
    "char_f": "キャラ 女性", "char_m": "キャラ 男性", "char_biba": "キャラ 美馬",
    "st_default": "ST画面 デフォルト", "st_shugo": "ST画面 メンバー集合", "st_mizugi": "ST画面 水着",
    "low_bell": "下段ベル"
  };

  const colorMap = {
    "mumei_off": "b-red", "mumei_on": "b-red", "mumei_lit": "b-red",
    "mumei_high": "b-red", "combo_mumei": "b-red", "combo_mumei_high": "b-red",
    "ikoma_off": "b-green", "ikoma_on": "b-green", "ikoma_lit": "b-green",
    "ikoma_high": "b-green", "combo_ikoma": "b-green", "combo_ikoma_high": "b-green",
    "cz_mumei": "b-blue", "cz_mumei_douai": "b-blue",
    "cz_ikoma": "b-blue", "cz_ikoma_douai": "b-blue",
    "cz_allstar_douai": "b-blue", "yuri_cut": "b-gray",
    "voice_f": "b-red", "voice_m": "b-blue", "voice_none": "b-gray",
    "voice_mumei_shukon": "b-red", "voice_ayame": "b-yellow", "voice_ikoma": "b-green",
    "voice_kurusu": "b-purple", "voice_kage_naze": "b-dark", "voice_kage_hito": "b-dark",
    "voice_kage_kotoshi": "b-dark", "voice_mumei_futsu": "b-red",
    "char_f": "b-red", "char_m": "b-blue", "char_biba": "b-purple",
    "st_default": "b-gray", "st_shugo": "b-yellow", "st_mizugi": "b-blue",
    "low_bell": "b-yellow"
  };

  let currentMumeiPts = 0;
  let currentIkomaPts = 0;

  function calcHistory() {
    sr = Array.from({ length: S }, () => BigNumber(1));
    currentMumeiPts = 0;
    currentIkomaPts = 0;
    let bellK = 0;
    
    history.forEach(item => {
      const h = item.t;
      const c = item.c;
      item.ptsStr = "";

      if (h === 'mumei_off' || h === 'mumei_on') currentMumeiPts += 1 * c;
      else if (h === 'mumei_lit' || h === 'mumei_high' || h === 'combo_mumei') currentMumeiPts += 15 * c;
      else if (h === 'combo_mumei_high') currentMumeiPts += 30 * c;

      else if (h === 'ikoma_off' || h === 'ikoma_on') currentIkomaPts += 1 * c;
      else if (h === 'ikoma_lit' || h === 'ikoma_high' || h === 'combo_ikoma') currentIkomaPts += 15 * c;
      else if (h === 'combo_ikoma_high') currentIkomaPts += 30 * c;

      else if (h === 'cz_mumei' || h === 'cz_mumei_douai') {
        item.ptsStr = ` (${currentMumeiPts}pt)`;
        currentMumeiPts = 0;
      }
      else if (h === 'cz_ikoma' || h === 'cz_ikoma_douai') {
        item.ptsStr = ` (${currentIkomaPts}pt)`;
        currentIkomaPts = 0;
      }
      else if (h === 'yuri_cut' || h === 'cz_allstar_douai') {
        currentMumeiPts = 0;
        currentIkomaPts = 0;
      }
      else if (h === 'char_f') applyIndependentRates([0.5000, 0.5750, 0.4150, 0.5850, 0.3990, 0.6000], c);
      else if (h === 'char_m') applyIndependentRates([0.5000, 0.4250, 0.5850, 0.4140, 0.6000, 0.3985], c);
      else if (h === 'char_biba') applyIndependentRates([0.0000, 0.0000, 0.0000, 0.0010, 0.0010, 0.0015], c);
      else if (h === 'low_bell') bellK += c;
    });

    const bellProbs = [1/121.1, 1/114.4, 1/112.8, 1/106.2, 1/104.2, 1/99.1];
    const bellGInput = document.getElementById("bell_g").value;
    const bellN = parseInt(bellGInput, 10);
    if (!isNaN(bellN) && bellN > 0) {
      const validN = Math.max(bellN, bellK);
      for (let s = 0; s < S; s++) {
        const p = bellProbs[s];
        sr[s] = sr[s].times(BigNumber(p).pow(bellK)).times(BigNumber(1 - p).pow(validN - bellK));
      }
    }

    updateUI();
  }

  function pushHistory(t) {
    if (history.length > 0 && history[history.length - 1].t === t) { 
      history[history.length - 1].c++; 
    } else { 
      history.push({ t: t, c: 1 }); 
    }
    calcHistory();
  }

  function apply(t) { pushHistory(t); }
  function onClearHistory() { history = []; calcHistory(); }
  function historyRemove(i) { history.splice(i, 1); calcHistory(); }
  function historyDown(i) { if (i <= 0) return; [history[i], history[i-1]] = [history[i-1], history[i]]; calcHistory(); }

  function updateUI() {
    let totalSr = sr.reduce((a, b) => a.plus(b), BigNumber(0));
    for (let s = 0; s < S; s++) {
      const p = totalSr.isZero() ? "0.00" : sr[s].dividedBy(totalSr).times(100).toFixed(2);
      document.getElementById("r" + s).textContent = p + "%";
    }

    document.getElementById("mumei-pt").textContent = currentMumeiPts;
    document.getElementById("ikoma-pt").textContent = currentIkomaPts;

    const histDiv = document.getElementById("history");
    let hHtml = "";
    for (let i = history.length - 1; i >= 0; i--) {
      const item = history[i];
      const dLabel = displayMap[item.t] || item.t;
      const label = (item.c > 1 ? `${dLabel} x ${item.c}` : dLabel) + (item.ptsStr || "");
      const col = colorMap[item.t] || "b-gray";
      
      hHtml += `<div class="history-item ${col}">`;
      hHtml += `<span class="history-label">${label}</span>`;
      hHtml += `<div>`;
      hHtml += `<button class="history-bt" onclick="historyDown(${i})">↓</button>`;
      hHtml += `<button class="history-bt" onclick="historyRemove(${i})">×</button>`;
      hHtml += `</div></div>`;
    }
    histDiv.innerHTML = hHtml;
  }

  updateUI();
</script>
</body>
</html>
